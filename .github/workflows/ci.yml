name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run typecheck
    # Without this, a bundling-only regression (the website analyzer's
    # require.resolve became a module id) ships green: lint, types and mocked
    # unit tests all pass on a build that cannot scan anything.
    - run: pnpm run build
    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps
    - name: Install Playwright system deps only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps
    # After the browser install: the analyzer integration tests in the unit
    # suite drive real Chromium (src/utils/*.integration.test.ts).
    - run: pnpm run test
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
